name: Sync public reset data

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/sync.yml

permissions:
  contents: write

concurrency:
  group: public-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the exporter
        run: python -m unittest discover -s tests -p 'test_sync.py' -v
      - name: Fetch and validate published website data
        run: python scripts/sync.py
      - name: Commit changed data
        run: |
          git add data/events.json data/events.csv
          if git diff --cached --quiet; then
            echo 'No public event changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: sync public Codex reset events'
          git push
